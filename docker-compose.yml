services:
  bara:
    build: .
    image: ${BARA_IMAGE:-tikstreak-bara}
    container_name: bara
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8000}:8000"
    environment:
      API_KEY: ${API_KEY:?Isi API_KEY di file .env}
      TZ: ${TZ:-Asia/Jakarta}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-*}
      SECRET_KEY: ${SECRET_KEY:-}
      HISTORY_DAYS: ${HISTORY_DAYS:-90}
      HISTORY_PER_ACCOUNT: ${HISTORY_PER_ACCOUNT:-1000}
      MAX_ACCOUNTS: ${MAX_ACCOUNTS:-100}
      MAX_ACCOUNTS_PER_USER: ${MAX_ACCOUNTS_PER_USER:-5}
      MAX_ACCOUNTS_PER_ADMIN: ${MAX_ACCOUNTS_PER_ADMIN:-10}
      BROWSER_WORKERS: ${BROWSER_WORKERS:-1}
      LOGIN_SESSIONS: ${LOGIN_SESSIONS:-1}
      QUEUE_JITTER_MIN: ${QUEUE_JITTER_MIN:-5}
      QUEUE_JITTER_MAX: ${QUEUE_JITTER_MAX:-20}
      BROWSER_RECYCLE_JOBS: ${BROWSER_RECYCLE_JOBS:-25}
      BROWSER_MAX_MB: ${BROWSER_MAX_MB:-700}
      BROWSER_KIND: ${BROWSER_KIND:-auto}
      # halaman depan untuk pengunjung belum login; LANDING_DOCS_URL opsional (tombol Panduan Pasang)
      RETRY_DELAY_MIN: ${RETRY_DELAY_MIN:-30}
      RETRY_MAX: ${RETRY_MAX:-2}
      SCAN_MAX: ${SCAN_MAX:-200}
      HEALTHCHECK_PING_URL: ${HEALTHCHECK_PING_URL:-}
      LANDING_ENABLED: ${LANDING_ENABLED:-1}
      LANDING_DOCS_URL: ${LANDING_DOCS_URL:-}
    volumes:
      - streak-data:/data
    shm_size: "1gb"

volumes:
  streak-data:
